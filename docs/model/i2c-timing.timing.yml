---
# Model of the figure 'i2c-timing'. Edit this file; `kokeb-docs figures` draws it. Never edit the SVGs.
# The waveform follows Figure 32 of the PCA9685 data sheet; every value is the Fast-mode Plus column of Table 15
# (the driver's `kMaxClockHz` is 1 MHz). Wave characters and keys: docs/figkit.md in ci-tools.
kind: timing
id: i2c-timing
title: I2C timing in Fast-mode Plus
kicker: On the bus
alt: >-
  I2C timing of the PCA9685 in Fast-mode Plus: the start condition, the first address bits, the last data bits, the
  acknowledge and the stop condition, with the bus free, start, clock, setup, valid and stop times of the data sheet.
reads: >-
  The two lanes are SCL and SDA, left to right in time. After the bus free time SDA falls while SCL is high (the
  start), bits A7 and A6 follow, each stable while SCL is high, the bits in between are left out, then D1, D0 and the
  acknowledge of the PCA9685, and SDA rises while SCL is high (the stop). The table gives each interval.
print: landscape
sources:
  - docs/model/i2c-timing.timing.yml
bus: i2c
refs:
  i2c-fig: {doc: pca9685, section: "13 Dynamic characteristics, Figure 32 I2C-bus timing diagram", page: 42}
signals:
  - {id: scl, label: SCL, wave: "11nn|nnnn11"}
  - {id: sda, label: SDA, wave: "10==|===01.", data: [A7, A6, D1, D0, A]}
groups:
  - {from: 1, to: 2, label: S}
  - {from: 2, to: 4, label: address, ref: i2c-fig}
  - {from: 5, to: 7, label: data, ref: i2c-fig}
  - {from: 7, to: 8, label: ACK, ref: i2c-fig}
  - {from: 9, to: 10, label: P}
params:
  - {id: fscl, symbol: fSCL, label: SCL clock frequency, min: 0, max: 1000, unit: kHz, ref: dynamic}
  - {id: tbuf, symbol: tBUF, label: Bus free time between a STOP and a START condition, min: 0.5, unit: µs,
     ref: dynamic}
  - {id: thd-sta, symbol: tHD;STA, label: Hold time of a (repeated) START condition, min: 0.26, unit: µs,
     ref: dynamic}
  - {id: tlow, symbol: tLOW, label: LOW period of the SCL clock, min: 0.5, unit: µs, ref: dynamic}
  - {id: thigh, symbol: tHIGH, label: HIGH period of the SCL clock, min: 0.26, unit: µs, ref: dynamic}
  - {id: tsu-dat, symbol: tSU;DAT, label: Data setup time, min: 50, unit: ns, ref: dynamic}
  - {id: thd-dat, symbol: tHD;DAT, label: Data hold time, min: 0, unit: ns, ref: dynamic}
  - {id: tvd-ack, symbol: tVD;ACK, label: SCL LOW to the acknowledge valid on SDA, min: 0.05, max: 0.45, unit: µs,
     ref: dynamic}
  - {id: tvd-dat, symbol: tVD;DAT, label: SCL LOW to SDA data out valid, min: 0.05, max: 0.45, unit: µs,
     ref: dynamic}
  - {id: tsu-sto, symbol: tSU;STO, label: Setup time of a STOP condition, min: 0.26, unit: µs, ref: dynamic}
  - {id: tr, symbol: tr, label: Rise time of SDA and SCL, max: 120, unit: ns, ref: dynamic}
  - {id: tf, symbol: tf, label: Fall time of SDA and SCL, max: 120, unit: ns, ref: dynamic}
  - {id: tsp, symbol: tSP, label: Spikes the input filter suppresses, max: 50, unit: ns, ref: dynamic}
marks:
  - {param: tbuf, signal: scl, from: 0, to: 1}
  - {param: tlow, signal: scl, from: 2, to: 2.5}
  - {param: thigh, signal: scl, from: 2.5, to: 3}
  - {param: thd-sta, signal: sda, from: 1, to: 2}
  - {param: tsu-dat, signal: sda, from: 3, to: 3.5}
  - {param: tvd-ack, signal: sda, from: 7, to: 7.4}
  - {param: tsu-sto, signal: sda, from: 8.5, to: 9}
notes:
  - {text: "The bus time-out resets the interface when SDA or SCL stays LOW for 25 ms.", ref: dynamic}
  - {text: "Standard-mode and Fast-mode values are in the other columns of Table 15.", ref: dynamic}
