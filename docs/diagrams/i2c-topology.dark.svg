<text x="52" y="294.9" font-size="17" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="52" y="322.6" font-size="15" fill="#D2DAE4">I2C controller</text>
<text x="52" y="386.8" font-size="17" font-weight="700" fill="#A7F3E6">PCA9685</text>
<text x="52" y="414.6" font-size="15" fill="#D2DAE4">0x40, A5 to A0 low</text>
<text x="52" y="478.8" font-size="17" font-weight="700" fill="#E8EDF3">…</text>
<text x="52" y="506.6" font-size="15" fill="#D2DAE4">one address per chip</text>
<text x="52" y="570.8" font-size="17" font-weight="700" fill="#A7F3E6">PCA9685</text>
<text x="52" y="598.6" font-size="15" fill="#D2DAE4">0x7F, A5 to A0 high</text>
<text x="542.7" y="188.4" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">SCL</text>
<circle cx="542.7" cy="282.4" r="3.6" fill="#D2DAE4"/>
<circle cx="542.7" cy="374.4" r="3.6" fill="#D2DAE4"/>
<circle cx="542.7" cy="466.4" r="3.6" fill="#D2DAE4"/>
<circle cx="542.7" cy="558.4" r="3.6" fill="#D2DAE4"/>
<text x="586.2" y="188.4" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">SDA</text>
<circle cx="586.2" cy="292.4" r="3.6" fill="#D2DAE4"/>
<circle cx="586.2" cy="384.4" r="3.6" fill="#D2DAE4"/>
<circle cx="586.2" cy="476.4" r="3.6" fill="#D2DAE4"/>
<circle cx="586.2" cy="568.4" r="3.6" fill="#D2DAE4"/>
<rect x="538.7" y="220.4" width="8" height="22" rx="2" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<rect x="582.2" y="220.4" width="8" height="22" rx="2" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="507" y="202.4" font-size="14" font-weight="600" text-anchor="end" fill="#FDE68A">pull-ups to VDD</text>
<text x="46" y="666.8" font-size="17" font-weight="700" fill="#E2E8F0">Limits</text>
<text x="46" y="687.2" font-size="15" fill="#E2E8F0">Six address pins give 64 addresses; 62 remain once LED All Call and</text>
<text x="46" y="709" font-size="15" fill="#E2E8F0">Software Reset are excluded (7.1, p. 7). Every PCA9685 also answers</text>
<text x="46" y="730.8" font-size="15" fill="#E2E8F0">LED All Call 0x70 from power-up; the driver clears MODE1.ALLCALL</text>
<text x="46" y="752.5" font-size="15" fill="#E2E8F0">(7.1.2, p. 8).</text>
</svg>
