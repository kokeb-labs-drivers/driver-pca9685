<svg xmlns="http://www.w3.org/2000/svg" width="640" height="799" viewBox="0 0 640 799" role="img" aria-labelledby="i2c-topology-title i2c-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="i2c-topology-title">Several PCA9685 on one I2C bus</title>
<desc id="i2c-topology-desc">An I2C bus on which an MCU and up to 62 PCA9685 controllers share SCL and SDA, each at the address its pins A5 to A0 select, with one pull-up resistor per line.</desc>
<rect x="0.5" y="0.5" width="639" height="798" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">Several PCA9685 on one I2C bus</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: 7.1.1 Regular I2C-bus slave address, Figure 4, p. 7; 10 Application</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">design-in information, Figure 26, p. 35; 7.1 Device addresses, p. 7; 7.1.2 LED</text>
<text x="32" y="146.2" font-size="15" fill="#9AA6B5">All Call I2C-bus address, p. 8.</text>
<rect x="32" y="162.2" width="576" height="1" fill="#252F3C"/>
