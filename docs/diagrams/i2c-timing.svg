<text x="32" y="1415" font-size="15" fill="#2B3442">Spikes the input filter suppresses</text>
<text x="32" y="1435.1" font-size="14" fill="#566070">Datasheet 13 Dynamic characteristics, Table 15, p. 40</text>
<text x="46" y="1489.2" font-size="17" font-weight="700" fill="#334155">Notes</text>
<text x="46" y="1509.6" font-size="15" fill="#334155">The bus time-out resets the interface when SDA or SCL stays LOW for</text>
<text x="46" y="1531.4" font-size="15" fill="#334155">25 ms. Standard-mode and Fast-mode values are in the other columns</text>
<text x="46" y="1553.1" font-size="15" fill="#334155">of Table 15.</text>
