<title id="i2c-timing-title">I2C timing in Fast-mode Plus</title>
<desc id="i2c-timing-desc">I2C timing of the PCA9685 in Fast-mode Plus: the start condition, the first address bits, the last data bits, the acknowledge and the stop condition, with the bus free, start, clock, setup, valid and stop times of the data sheet.</desc>
