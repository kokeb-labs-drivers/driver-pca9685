<rect x="32" y="266.4" width="463" height="74" rx="10" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="274.4" width="4" height="58" rx="2" fill="#2563EB"/>
<rect x="32" y="358.4" width="463" height="74" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="366.4" width="4" height="58" rx="2" fill="#0B7A72"/>
<rect x="32" y="450.4" width="463" height="74" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="542.4" width="463" height="74" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
