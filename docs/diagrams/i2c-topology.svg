<path d="M495 384.4 L586.2 384.4" fill="none" stroke="#2B3442" stroke-width="1.8"/>
<path d="M495 476.4 L586.2 476.4" fill="none" stroke="#2B3442" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M495 568.4 L586.2 568.4" fill="none" stroke="#2B3442" stroke-width="1.8"/>
