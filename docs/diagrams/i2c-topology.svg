<rect x="32" y="638.4" width="576" height="130.3" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="52" y="294.9" font-size="17" font-weight="700" fill="#1E429F">MCU</text>
<text x="52" y="322.6" font-size="15" fill="#2B3442">I2C controller</text>
<text x="52" y="386.8" font-size="17" font-weight="700" fill="#0B5F59">PCA9685</text>
<text x="52" y="414.6" font-size="15" fill="#2B3442">0x40, A5 to A0 low</text>
<text x="52" y="478.8" font-size="17" font-weight="700" fill="#0E1726">…</text>
<text x="52" y="506.6" font-size="15" fill="#2B3442">one address per chip</text>
<text x="52" y="570.8" font-size="17" font-weight="700" fill="#0B5F59">PCA9685</text>
<text x="52" y="598.6" font-size="15" fill="#2B3442">0x7F, A5 to A0 high</text>
<text x="542.7" y="188.4" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">SCL</text>
<circle cx="542.7" cy="282.4" r="3.6" fill="#2B3442"/>
<circle cx="542.7" cy="374.4" r="3.6" fill="#2B3442"/>
<circle cx="542.7" cy="466.4" r="3.6" fill="#2B3442"/>
<circle cx="542.7" cy="558.4" r="3.6" fill="#2B3442"/>
<text x="586.2" y="188.4" font-size="14" font-weight="700" text-anchor="middle" fill="#0E1726">SDA</text>
<circle cx="586.2" cy="292.4" r="3.6" fill="#2B3442"/>
<circle cx="586.2" cy="384.4" r="3.6" fill="#2B3442"/>
<circle cx="586.2" cy="476.4" r="3.6" fill="#2B3442"/>
<circle cx="586.2" cy="568.4" r="3.6" fill="#2B3442"/>
<rect x="538.7" y="220.4" width="8" height="22" rx="2" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<rect x="582.2" y="220.4" width="8" height="22" rx="2" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="507" y="202.4" font-size="14" font-weight="600" text-anchor="end" fill="#8A3C0B">pull-ups to VDD</text>
<text x="46" y="666.8" font-size="17" font-weight="700" fill="#334155">Limits</text>
<text x="46" y="687.2" font-size="15" fill="#334155">Six address pins give 64 addresses; 62 remain once LED All Call and</text>
<text x="46" y="709" font-size="15" fill="#334155">Software Reset are excluded (7.1, p. 7). Every PCA9685 also answers</text>
<text x="46" y="730.8" font-size="15" fill="#334155">LED All Call 0x70 from power-up; the driver clears MODE1.ALLCALL</text>
<text x="46" y="752.5" font-size="15" fill="#334155">(7.1.2, p. 8).</text>
</svg>
