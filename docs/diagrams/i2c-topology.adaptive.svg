<text x="52" y="294.9" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="52" y="322.6" font-size="15" class="fk-f-ink2">I2C controller</text>
<text x="52" y="386.8" font-size="17" font-weight="700" class="fk-f-teal-text">PCA9685</text>
<text x="52" y="414.6" font-size="15" class="fk-f-ink2">0x40, A5 to A0 low</text>
<text x="52" y="478.8" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="52" y="506.6" font-size="15" class="fk-f-ink2">one address per chip</text>
<text x="52" y="570.8" font-size="17" font-weight="700" class="fk-f-teal-text">PCA9685</text>
<text x="52" y="598.6" font-size="15" class="fk-f-ink2">0x7F, A5 to A0 high</text>
<text x="542.7" y="188.4" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">SCL</text>
