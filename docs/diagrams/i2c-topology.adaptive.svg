<svg xmlns="http://www.w3.org/2000/svg" width="640" height="799" viewBox="0 0 640 799" role="img" aria-labelledby="i2c-topology-title i2c-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="i2c-topology-title">Several PCA9685 on one I2C bus</title>
<desc id="i2c-topology-desc">An I2C bus on which an MCU and up to 62 PCA9685 controllers share SCL and SDA, each at the address its pins A5 to A0 select, with one pull-up resistor per line.</desc>
