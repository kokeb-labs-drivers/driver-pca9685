<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">Several PCA9685 on one I2C bus</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Datasheet: 7.1.1 Regular I2C-bus slave address, Figure 4, p. 7; 10 Application</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">design-in information, Figure 26, p. 35; 7.1 Device addresses, p. 7; 7.1.2 LED</text>
<text x="32" y="146.2" font-size="15" class="fk-f-muted">All Call I2C-bus address, p. 8.</text>
