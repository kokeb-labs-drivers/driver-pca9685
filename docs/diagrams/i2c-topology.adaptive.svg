<text x="507" y="202.4" font-size="14" font-weight="600" text-anchor="end" class="fk-f-amber-text">pull-ups to VDD</text>
<text x="46" y="666.8" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="687.2" font-size="15" class="fk-f-slate-text">Six address pins give 64 addresses; 62 remain once LED All Call and</text>
<text x="46" y="709" font-size="15" class="fk-f-slate-text">Software Reset are excluded (7.1, p. 7). Every PCA9685 also answers</text>
<text x="46" y="730.8" font-size="15" class="fk-f-slate-text">LED All Call 0x70 from power-up; the driver clears MODE1.ALLCALL</text>
<text x="46" y="752.5" font-size="15" class="fk-f-slate-text">(7.1.2, p. 8).</text>
