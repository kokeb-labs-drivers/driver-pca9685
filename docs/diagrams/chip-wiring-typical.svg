<text x="573" y="441.5" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">OE  pin 23</text>
<text x="573" y="474.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">GpioSet(CtrlPin::OutputEnable)</text>
<text x="573" y="495.9" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R3 10 kΩ</text>
<text x="50" y="575.3" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="598.8" font-size="17" fill="#9F1239">+3V3: VDD; also U2.VDD · +5V: ; also J1.5V · GND: A0, A1, A2, A3, A4, A5, EXTCLK, VSS; also U2.GND, J1.GND</text>
<text x="50" y="668.3" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="691.8" font-size="17" fill="#334155">Support parts: 1 capacitor, 4 resistors, 1 other part around the supplies (values in the full schematic). Not wired in this circuit (15):</text>
<text x="50" y="716.4" font-size="17" fill="#334155">LED1, LED2, LED3, LED4, LED5, LED6, LED7, LED8, LED9, LED10, LED11, LED12, LED13, LED14, LED15.</text>
<text x="32" y="762.4" font-size="16" fill="#566070">* Not confirmed in the datasheet: R1: figure 26 leaves the value to UM10204 section 7; 4.7 kΩ suits 100 kHz and 400 kHz; R2: figure 26 leaves</text>
<text x="32" y="785.5" font-size="16" fill="#566070">the value to UM10204 section 7; 4.7 kΩ suits 100 kHz and 400 kHz; C1: figure 26 shows no decoupling capacitor; section 10, question 2</text>
<text x="32" y="808.5" font-size="16" fill="#566070">advises one near the chip; R4: figure 26 gives no value; 150 Ω is about 20 mA for a 2 V LED from 5 V, under the 25 mA limit.</text>
