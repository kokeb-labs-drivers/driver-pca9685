<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="876" viewBox="0 0 1200 876" role="img" aria-labelledby="chip-wiring-typical-title chip-wiring-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-typical-title">Wiring: Typical application</title>
<desc id="chip-wiring-typical-desc">Wiring of the PCA9685 for the Typical application: MCU I2C SCL to SCL (Write() / WriteRead()); MCU I2C SDA to SDA (Write() / WriteRead()); MCU GPIO (OE) to OE (GpioSet(CtrlPin::OutputEnable)). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="875" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">Wiring: Typical application</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#566070">Hardware page. Datasheet: 10 Application design-in information, Figure 26, p. 35.</text>
