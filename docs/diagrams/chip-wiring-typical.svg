<text x="872.6" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#0E1726">PCA9685</text>
<text x="872.6" y="232.9" font-size="16" text-anchor="middle" fill="#566070">U1</text>
<text x="225.4" y="210.5" font-size="20" font-weight="700" fill="#1E429F">MCU</text>
<text x="225.4" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="389.4" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">I2C SCL</text>
<text x="774.6" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SCL</text>
<rect x="738.6" y="274.3" width="14" height="12" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="573" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">SCL  pin 26</text>
<text x="573" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">Write() / WriteRead()</text>
<text x="573" y="324.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R1 4.7 kΩ</text>
<text x="389.4" y="371.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">I2C SDA</text>
<text x="774.6" y="371.7" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SDA</text>
