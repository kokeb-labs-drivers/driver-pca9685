<rect x="32" y="889.5" width="1136" height="79.3" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="52" y="186.3" font-size="15" font-weight="700" fill="#0B5F59">Sleep(mode)</text>
<text x="52" y="211.2" font-size="13" fill="#2B3442">OutputsOff (default) or HoldOutputs</text>
<text x="52" y="295.3" font-size="15" font-weight="700" fill="#1E429F">OutputsOff: every channel off</text>
<text x="52" y="320.1" font-size="13" fill="#2B3442">ALL_LED_OFF_H: nothing left to hold</text>
<text x="52" y="339" font-size="13" fill="#2B3442">if that write fails: no sleep</text>
<text x="52" y="423.3" font-size="15" font-weight="700" fill="#1E429F">Reset check</text>
<text x="52" y="448.2" font-size="13" fill="#2B3442">read MODE1, MODE2, SUBADR1: as the copy? twice to act</text>
<text x="52" y="532.3" font-size="15" font-weight="700" fill="#1E429F">MODE1.SLEEP = 1 (0x10)</text>
<text x="52" y="557.2" font-size="13" fill="#2B3442">the oscillator stops</text>
<text x="52" y="641.3" font-size="15" font-weight="700" fill="#8A3C0B">Asleep</text>
<text x="52" y="666.2" font-size="13" fill="#2B3442">OutputsOff: every output off, RESTART clear</text>
<text x="52" y="685" font-size="13" fill="#2B3442">HoldOutputs: RESTART set; an output may hold its level, so a switch-off</text>
<text x="52" y="703.9" font-size="13" fill="#2B3442">returns Asleep</text>
<text x="650" y="186.3" font-size="15" font-weight="700" fill="#0B5F59">Wake()</text>
<text x="650" y="211.2" font-size="13" fill="#2B3442">also the end of SetPwmFrequency()</text>
<text x="650" y="295.3" font-size="15" font-weight="700" fill="#1E429F">Reset check</text>
<text x="650" y="320.1" font-size="13" fill="#2B3442">read MODE1, MODE2, SUBADR1 (section 7.3.1.1, step 1)</text>
<text x="650" y="404.3" font-size="15" font-weight="700" fill="#1E429F">MODE1.SLEEP = 0, wait 500 us</text>
<text x="650" y="429.2" font-size="13" fill="#2B3442">the oscillator start-up (table 5, note 2)</text>
<text x="650" y="448" font-size="13" fill="#2B3442">the wake check is pending from here</text>
<text x="650" y="532.3" font-size="15" font-weight="700" fill="#1E429F">Wake check</text>
<text x="650" y="557.2" font-size="13" fill="#2B3442">read MODE1, MODE2, SUBADR1, PRE_SCALE: as the copy?</text>
<text x="650" y="576" font-size="13" fill="#2B3442">differs twice: DeviceReset</text>
<text x="650" y="660.3" font-size="15" font-weight="700" fill="#1E429F">RESTART reads 1: write it as 1 (0x80)</text>
<text x="650" y="685.2" font-size="13" fill="#2B3442">the channels that ran restart</text>
<text x="650" y="704" font-size="13" fill="#2B3442">it clears SLEEP too: the wake check once more</text>
<text x="650" y="788.3" font-size="15" font-weight="700" fill="#14532D">Running</text>
<text x="650" y="813.2" font-size="13" fill="#2B3442">the chip holds the driver's MODE2 and prescaler</text>
<text x="650" y="832" font-size="13" fill="#2B3442">no output held</text>
<text x="46" y="916.3" font-size="15" font-weight="700" fill="#334155">When a check fails</text>
<text x="46" y="934.1" font-size="13" fill="#334155">A wake check that fails (a bus error) stays pending: the next call runs it first and a switch-on is refused until it passes. A switch-off is still sent. Only an acknowledged</text>
<text x="46" y="953" font-size="13" fill="#334155">wake write followed by a check that reads SLEEP = 0 clears the doubt that an output is held; Wake() leaves Asleep for Running.</text>
<rect x="32" y="984.3" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="995.9" font-size="12.5" fill="#566070">your call</text>
<rect x="131.4" y="984.3" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="153.4" y="995.9" font-size="12.5" fill="#566070">driver steps</text>
<rect x="251.7" y="984.3" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="273.7" y="995.9" font-size="12.5" fill="#566070">outputs may hold</text>
<rect x="406.2" y="984.3" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="428.2" y="995.9" font-size="12.5" fill="#566070">running</text>
<path d="M499.8 990.5L529.8 990.5" fill="none" stroke="#8893A2" stroke-width="1.6" marker-end="url(#fk-arrow-rail)"/>
<text x="543.8" y="995.9" font-size="12.5" fill="#566070">next step</text>
</svg>
