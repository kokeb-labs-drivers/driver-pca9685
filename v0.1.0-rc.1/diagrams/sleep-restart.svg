<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="sleep-restart-title sleep-restart-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="sleep-restart-title">Sleep, wake and restart</title>
<desc id="sleep-restart-desc">Two columns: Sleep() with the outputs off or held, and the wake that clears SLEEP, waits for the oscillator, checks MODE1, MODE2 and PRE_SCALE, then writes RESTART and checks again; a band below says what a failed check leaves.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1029" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">API GUIDE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Sleep, wake and restart</text>
<text x="32" y="103.8" font-size="15" fill="#566070">MODE1 is written from the driver's copy only after a read that proves the chip did not reset, and every write that clears SLEEP is followed by the wake</text>
<text x="32" y="125.5" font-size="15" fill="#566070">check.</text>
