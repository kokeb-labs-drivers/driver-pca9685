<text x="48" y="331.4" font-size="17" font-weight="700" fill="#7A360E">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#7A360E">PCA9685, inc/pca9685.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<text x="56" y="649.6" font-size="20" font-weight="700" fill="#7A360E">Port contract</text>
<text x="56" y="680.2" font-size="17" fill="#2B3442">I2cInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="802.6" font-size="20" font-weight="700" fill="#0B5F59">Your port</text>
<text x="56" y="831.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  Write()  WriteRead()  DelayUs()  GpioSet() </text>
<text x="56" y="855" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">GetLastFailure()  Log()</text>
<text x="56" y="977.6" font-size="20" font-weight="700" fill="#334155">PCA9685</text>
<text x="56" y="1008.2" font-size="17" fill="#2B3442">the chip, on the I2C bus</text>
<rect x="322.9" y="570.6" width="214.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="588.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">register reads and writes</text>
<rect x="329.6" y="723.6" width="200.8" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="741.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">forwards to your hooks</text>
<rect x="371.3" y="898.6" width="117.4" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="916.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">I2C transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#7A360E">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#7A360E">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#7A360E">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#7A360E">and on the host.</text>
<text x="886" y="802.6" font-size="20" font-weight="700" fill="#0B5F59">Yours</text>
<text x="886" y="826.1" font-size="17" fill="#0B5F59">One small class per MCU or</text>
<text x="886" y="850.7" font-size="17" fill="#0B5F59">board.</text>
<rect x="32" y="1044" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="1058.6" font-size="16" fill="#566070">you write</text>
