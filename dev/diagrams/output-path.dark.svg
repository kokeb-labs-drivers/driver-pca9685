<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="599" viewBox="0 0 1200 599" role="img" aria-labelledby="output-path-title output-path-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="output-path-title">From the registers to the pin</title>
<desc id="output-path-desc">Five stages left to right: full OFF, full ON and the counter decide the channel logic; sleep freezes it; INVRT and OUTDRV set the pin level; OE high replaces it with the OUTNE level; a table gives the off level per configuration.</desc>
