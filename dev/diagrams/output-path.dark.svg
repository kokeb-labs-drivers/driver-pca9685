<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">From the registers to the pin</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">OE high always gives the level of a channel that is off: the driver chooses OUTNE for that.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
