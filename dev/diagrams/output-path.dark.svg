<text x="52" y="164.6" font-size="15" font-weight="700" fill="#BFDBFE">Channel logic</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">LEDn_OFF_H bit 4: off, whatever</text>
<text x="52" y="208.2" font-size="13" fill="#D2DAE4">else</text>
<text x="52" y="227.1" font-size="13" fill="#D2DAE4">LEDn_ON_H bit 4: on</text>
<text x="52" y="245.9" font-size="13" fill="#D2DAE4">else on from the ON count to the</text>
<text x="52" y="264.8" font-size="13" fill="#D2DAE4">OFF count</text>
<text x="344.5" y="164.6" font-size="15" font-weight="700" fill="#FDE68A">Asleep?</text>
<text x="344.5" y="189.4" font-size="13" fill="#D2DAE4">oscillator off: an output is neither</text>
<text x="344.5" y="208.2" font-size="13" fill="#D2DAE4">switched on nor off</text>
<text x="344.5" y="227.1" font-size="13" fill="#D2DAE4">it may hold its level (not specified)</text>
<text x="637" y="164.6" font-size="15" font-weight="700" fill="#DDD6FE">INVRT and OUTDRV</text>
<text x="637" y="189.4" font-size="13" fill="#D2DAE4">INVRT = 1 inverts (OE low only)</text>
<text x="637" y="208.2" font-size="13" fill="#D2DAE4">high: driven (totem pole) or</text>
<text x="637" y="227.1" font-size="13" fill="#D2DAE4">high impedance (open drain)</text>
<text x="929.5" y="164.6" font-size="15" font-weight="700" fill="#FECDD3">OE pin</text>
<text x="929.5" y="189.4" font-size="13" fill="#D2DAE4">low: the level from the left</text>
<text x="929.5" y="208.2" font-size="13" fill="#D2DAE4">high: the OUTNE level, within 60</text>
<text x="929.5" y="227.1" font-size="13" fill="#D2DAE4">ns</text>
<text x="52" y="358.6" font-size="15" font-weight="700" fill="#E8EDF3">Configuration</text>
<text x="473" y="358.6" font-size="15" font-weight="700" fill="#E8EDF3">Channel off at the pin</text>
<text x="689.4" y="358.6" font-size="15" font-weight="700" fill="#E8EDF3">OUTNE</text>
<text x="837.8" y="358.6" font-size="15" font-weight="700" fill="#E8EDF3">Reset state off?</text>
<text x="52" y="412.6" font-size="15" font-weight="700" fill="#DDD6FE">Not inverted (Config{}, ServoPreset())</text>
<text x="473" y="412.6" font-size="15" font-weight="700" fill="#E8EDF3">low</text>
<text x="689.4" y="412.6" font-size="15" font-weight="700" fill="#E8EDF3">00</text>
<text x="837.8" y="412.6" font-size="15" font-weight="700" fill="#E8EDF3">yes: off for an active-high load</text>
<text x="52" y="466.6" font-size="15" font-weight="700" fill="#DDD6FE">Inverted, totem pole (P-type driver)</text>
<text x="473" y="466.6" font-size="15" font-weight="700" fill="#E8EDF3">high</text>
<text x="689.4" y="466.6" font-size="15" font-weight="700" fill="#E8EDF3">01</text>
<text x="837.8" y="466.6" font-size="15" font-weight="700" fill="#E8EDF3">no: low turns the load on</text>
<text x="52" y="520.5" font-size="15" font-weight="700" fill="#DDD6FE">Inverted, open drain (DirectLedPreset())</text>
<text x="473" y="520.5" font-size="15" font-weight="700" fill="#E8EDF3">high impedance</text>
<text x="689.4" y="520.5" font-size="15" font-weight="700" fill="#E8EDF3">10</text>
<text x="837.8" y="520.5" font-size="15" font-weight="700" fill="#E8EDF3">no: low lights the LED</text>
<rect x="32" y="553.2" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="54" y="564.8" font-size="12.5" fill="#9AA6B5">channel logic</text>
<rect x="161.2" y="553.2" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="183.2" y="564.8" font-size="12.5" fill="#9AA6B5">asleep</text>
<rect x="248.4" y="553.2" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="270.4" y="564.8" font-size="12.5" fill="#9AA6B5">output stage</text>
<rect x="373.2" y="553.2" width="14" height="14" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<text x="395.2" y="564.8" font-size="12.5" fill="#9AA6B5">OE</text>
</svg>
