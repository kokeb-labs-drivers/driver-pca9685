<text x="52" y="164.6" font-size="15" font-weight="700" fill="#1E429F">Channel logic</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">LEDn_OFF_H bit 4: off, whatever</text>
<text x="52" y="208.2" font-size="13" fill="#2B3442">else</text>
<text x="52" y="227.1" font-size="13" fill="#2B3442">LEDn_ON_H bit 4: on</text>
<text x="52" y="245.9" font-size="13" fill="#2B3442">else on from the ON count to the</text>
<text x="52" y="264.8" font-size="13" fill="#2B3442">OFF count</text>
<text x="344.5" y="164.6" font-size="15" font-weight="700" fill="#8A3C0B">Asleep?</text>
<text x="344.5" y="189.4" font-size="13" fill="#2B3442">oscillator off: an output is neither</text>
<text x="344.5" y="208.2" font-size="13" fill="#2B3442">switched on nor off</text>
<text x="344.5" y="227.1" font-size="13" fill="#2B3442">it may hold its level (not specified)</text>
<text x="637" y="164.6" font-size="15" font-weight="700" fill="#5B21B6">INVRT and OUTDRV</text>
<text x="637" y="189.4" font-size="13" fill="#2B3442">INVRT = 1 inverts (OE low only)</text>
<text x="637" y="208.2" font-size="13" fill="#2B3442">high: driven (totem pole) or</text>
<text x="637" y="227.1" font-size="13" fill="#2B3442">high impedance (open drain)</text>
<text x="929.5" y="164.6" font-size="15" font-weight="700" fill="#9F1239">OE pin</text>
<text x="929.5" y="189.4" font-size="13" fill="#2B3442">low: the level from the left</text>
<text x="929.5" y="208.2" font-size="13" fill="#2B3442">high: the OUTNE level, within 60</text>
<text x="929.5" y="227.1" font-size="13" fill="#2B3442">ns</text>
<text x="52" y="358.6" font-size="15" font-weight="700" fill="#0E1726">Configuration</text>
<text x="473" y="358.6" font-size="15" font-weight="700" fill="#0E1726">Channel off at the pin</text>
<text x="689.4" y="358.6" font-size="15" font-weight="700" fill="#0E1726">OUTNE</text>
<text x="837.8" y="358.6" font-size="15" font-weight="700" fill="#0E1726">Reset state off?</text>
<text x="52" y="412.6" font-size="15" font-weight="700" fill="#5B21B6">Not inverted (Config{}, ServoPreset())</text>
<text x="473" y="412.6" font-size="15" font-weight="700" fill="#0E1726">low</text>
<text x="689.4" y="412.6" font-size="15" font-weight="700" fill="#0E1726">00</text>
<text x="837.8" y="412.6" font-size="15" font-weight="700" fill="#0E1726">yes: off for an active-high load</text>
<text x="52" y="466.6" font-size="15" font-weight="700" fill="#5B21B6">Inverted, totem pole (P-type driver)</text>
<text x="473" y="466.6" font-size="15" font-weight="700" fill="#0E1726">high</text>
<text x="689.4" y="466.6" font-size="15" font-weight="700" fill="#0E1726">01</text>
<text x="837.8" y="466.6" font-size="15" font-weight="700" fill="#0E1726">no: low turns the load on</text>
<text x="52" y="520.5" font-size="15" font-weight="700" fill="#5B21B6">Inverted, open drain (DirectLedPreset())</text>
<text x="473" y="520.5" font-size="15" font-weight="700" fill="#0E1726">high impedance</text>
<text x="689.4" y="520.5" font-size="15" font-weight="700" fill="#0E1726">10</text>
<text x="837.8" y="520.5" font-size="15" font-weight="700" fill="#0E1726">no: low lights the LED</text>
<rect x="32" y="553.2" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="54" y="564.8" font-size="12.5" fill="#566070">channel logic</text>
<rect x="161.2" y="553.2" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="183.2" y="564.8" font-size="12.5" fill="#566070">asleep</text>
<rect x="248.4" y="553.2" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="270.4" y="564.8" font-size="12.5" fill="#566070">output stage</text>
<rect x="373.2" y="553.2" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="395.2" y="564.8" font-size="12.5" fill="#566070">OE</text>
</svg>
