<text x="52" y="164.6" font-size="15" font-weight="700" fill="#0E1726">Control register</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">LEDn_ON_L address</text>
<text x="282" y="164.6" font-size="15" font-weight="700" fill="#1E429F">ON_L</text>
<text x="282" y="189.4" font-size="13" fill="#2B3442">ON count 7..0</text>
<text x="512" y="164.6" font-size="15" font-weight="700" fill="#1E429F">ON_H</text>
<text x="512" y="189.4" font-size="13" fill="#2B3442">bit 4 full ON (0x10), count</text>
<text x="512" y="208.2" font-size="13" fill="#2B3442">11..8</text>
<text x="742" y="164.6" font-size="15" font-weight="700" fill="#1E429F">OFF_L</text>
<text x="742" y="189.4" font-size="13" fill="#2B3442">OFF count 7..0</text>
<text x="972" y="164.6" font-size="15" font-weight="700" fill="#1E429F">OFF_H</text>
<text x="972" y="189.4" font-size="13" fill="#2B3442">bit 4 full OFF (0x10), count</text>
<text x="972" y="208.2" font-size="13" fill="#2B3442">11..8</text>
<text x="52" y="292.6" font-size="15" font-weight="700" fill="#0E1726">STOP: the four registers reach the output together (MODE2.OCH = 0)</text>
<text x="52" y="317.4" font-size="13" fill="#2B3442">a switch-on waits for a passing wake check</text>
<text x="52" y="411.6" font-size="15" font-weight="700" fill="#14532D">Acknowledged: Ok</text>
<text x="52" y="436.4" font-size="13" fill="#2B3442">the copy takes the value</text>
<text x="52" y="455.3" font-size="13" fill="#2B3442">GetChannel() returns it</text>
<text x="438.7" y="411.6" font-size="15" font-weight="700" fill="#9F1239">NACK part-way: Bus</text>
<text x="438.7" y="436.4" font-size="13" fill="#2B3442">the bytes before the NACK are stored and applied</text>
<text x="438.7" y="455.3" font-size="13" fill="#2B3442">at the STOP</text>
<text x="438.7" y="474.1" font-size="13" fill="#2B3442">the channel is unknown until a write or a read</text>
<text x="438.7" y="493" font-size="13" fill="#2B3442">succeeds</text>
<text x="438.7" y="511.8" font-size="13" fill="#2B3442">EnableOutputs() refuses meanwhile</text>
<text x="825.3" y="411.6" font-size="15" font-weight="700" fill="#334155">Address NACK: NoDevice</text>
<text x="825.3" y="436.4" font-size="13" fill="#2B3442">nothing arrived</text>
<text x="825.3" y="455.3" font-size="13" fill="#2B3442">the copy is kept, nothing unknown</text>
<text x="825.3" y="474.1" font-size="13" fill="#2B3442">needs the port's GetLastFailure()</text>
<text x="46" y="595.5" font-size="15" font-weight="700" fill="#14532D">Switch-off</text>
<text x="46" y="613.4" font-size="13" fill="#14532D">A switch-off is one data byte: LEDn_OFF_H (control register 0x06 + 4 x n + 3) = 0x10, or ALL_LED_OFF_H = 0x10 for every channel. It is stored or it is not, and full OFF</text>
<text x="46" y="632.2" font-size="13" fill="#14532D">takes precedence over the other bytes, so even a failed switch-off never makes a channel more active. It is sent whatever the driver doubts, and once started also after a</text>
<text x="46" y="651" font-size="13" fill="#14532D">reset was found.</text>
<rect x="32" y="682.4" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="54" y="694" font-size="12.5" fill="#566070">bytes on the bus</text>
<rect x="182.4" y="682.4" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="204.4" y="694" font-size="12.5" fill="#566070">Ok</text>
<rect x="245.8" y="682.4" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="267.8" y="694" font-size="12.5" fill="#566070">Bus</text>
<rect x="315.3" y="682.4" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="337.3" y="694" font-size="12.5" fill="#566070">NoDevice</text>
</svg>
