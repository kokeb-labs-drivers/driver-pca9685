<rect x="32" y="889.5" width="1136" height="79.3" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="52" y="186.3" font-size="15" font-weight="700" fill="#A7F3E6">Sleep(mode)</text>
<text x="52" y="211.2" font-size="13" fill="#D2DAE4">OutputsOff (default) or HoldOutputs</text>
<text x="52" y="295.3" font-size="15" font-weight="700" fill="#BFDBFE">OutputsOff: every channel off</text>
<text x="52" y="320.1" font-size="13" fill="#D2DAE4">ALL_LED_OFF_H: nothing left to hold</text>
<text x="52" y="339" font-size="13" fill="#D2DAE4">if that write fails: no sleep</text>
<text x="52" y="423.3" font-size="15" font-weight="700" fill="#BFDBFE">Reset check</text>
<text x="52" y="448.2" font-size="13" fill="#D2DAE4">read MODE1, MODE2, SUBADR1: as the copy? twice to act</text>
<text x="52" y="532.3" font-size="15" font-weight="700" fill="#BFDBFE">MODE1.SLEEP = 1 (0x10)</text>
<text x="52" y="557.2" font-size="13" fill="#D2DAE4">the oscillator stops</text>
<text x="52" y="641.3" font-size="15" font-weight="700" fill="#FDE68A">Asleep</text>
<text x="52" y="666.2" font-size="13" fill="#D2DAE4">OutputsOff: every output off, RESTART clear</text>
<text x="52" y="685" font-size="13" fill="#D2DAE4">HoldOutputs: RESTART set; an output may hold its level, so a switch-off</text>
<text x="52" y="703.9" font-size="13" fill="#D2DAE4">returns Asleep</text>
<text x="650" y="186.3" font-size="15" font-weight="700" fill="#A7F3E6">Wake()</text>
<text x="650" y="211.2" font-size="13" fill="#D2DAE4">also the end of SetPwmFrequency()</text>
<text x="650" y="295.3" font-size="15" font-weight="700" fill="#BFDBFE">Reset check</text>
<text x="650" y="320.1" font-size="13" fill="#D2DAE4">read MODE1, MODE2, SUBADR1 (section 7.3.1.1, step 1)</text>
<text x="650" y="404.3" font-size="15" font-weight="700" fill="#BFDBFE">MODE1.SLEEP = 0, wait 500 us</text>
<text x="650" y="429.2" font-size="13" fill="#D2DAE4">the oscillator start-up (table 5, note 2)</text>
<text x="650" y="448" font-size="13" fill="#D2DAE4">the wake check is pending from here</text>
<text x="650" y="532.3" font-size="15" font-weight="700" fill="#BFDBFE">Wake check</text>
<text x="650" y="557.2" font-size="13" fill="#D2DAE4">read MODE1, MODE2, SUBADR1, PRE_SCALE: as the copy?</text>
<text x="650" y="576" font-size="13" fill="#D2DAE4">differs twice: DeviceReset</text>
<text x="650" y="660.3" font-size="15" font-weight="700" fill="#BFDBFE">RESTART reads 1: write it as 1 (0x80)</text>
<text x="650" y="685.2" font-size="13" fill="#D2DAE4">the channels that ran restart</text>
<text x="650" y="704" font-size="13" fill="#D2DAE4">it clears SLEEP too: the wake check once more</text>
<text x="650" y="788.3" font-size="15" font-weight="700" fill="#BBF7D0">Running</text>
<text x="650" y="813.2" font-size="13" fill="#D2DAE4">the chip holds the driver's MODE2 and prescaler</text>
<text x="650" y="832" font-size="13" fill="#D2DAE4">no output held</text>
<text x="46" y="916.3" font-size="15" font-weight="700" fill="#E2E8F0">When a check fails</text>
<text x="46" y="934.1" font-size="13" fill="#E2E8F0">A wake check that fails (a bus error) stays pending: the next call runs it first and a switch-on is refused until it passes. A switch-off is still sent. Only an acknowledged</text>
<text x="46" y="953" font-size="13" fill="#E2E8F0">wake write followed by a check that reads SLEEP = 0 clears the doubt that an output is held; Wake() leaves Asleep for Running.</text>
<rect x="32" y="984.3" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="54" y="995.9" font-size="12.5" fill="#9AA6B5">your call</text>
<rect x="131.4" y="984.3" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="153.4" y="995.9" font-size="12.5" fill="#9AA6B5">driver steps</text>
<rect x="251.7" y="984.3" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="273.7" y="995.9" font-size="12.5" fill="#9AA6B5">outputs may hold</text>
<rect x="406.2" y="984.3" width="14" height="14" rx="4" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
<text x="428.2" y="995.9" font-size="12.5" fill="#9AA6B5">running</text>
<path d="M499.8 990.5L529.8 990.5" fill="none" stroke="#6C7889" stroke-width="1.6" marker-end="url(#fk-arrow-rail)"/>
<text x="543.8" y="995.9" font-size="12.5" fill="#9AA6B5">next step</text>
</svg>
