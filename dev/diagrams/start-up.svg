<rect x="32" y="375.8" width="4" height="109" rx="2" fill="#2563EB"/>
<rect x="772" y="395.8" width="396" height="69" rx="10" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<rect x="772" y="403.8" width="4" height="53" rx="2" fill="#DB2752"/>
