<rect x="32" y="814.8" width="4" height="72" rx="2" fill="#2563EB"/>
<rect x="772" y="816.3" width="396" height="69" rx="10" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<rect x="772" y="824.3" width="4" height="53" rx="2" fill="#DB2752"/>
<rect x="32" y="940.8" width="640" height="69" rx="10" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<rect x="32" y="948.8" width="4" height="53" rx="2" fill="#15803D"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#0B5F59">EnsureInitialized()</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">started already?</text>
<text x="792" y="164.6" font-size="15" font-weight="700" fill="#14532D">Ok, or the start-up again</text>
<text x="792" y="189.4" font-size="13" fill="#2B3442">the reset check: one read; a reset found: from step 1</text>
<rect x="705.2" y="162.3" width="33.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="176.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">yes</text>
<text x="52" y="279.6" font-size="15" font-weight="700" fill="#1E429F">Check the configuration and the address</text>
<text x="52" y="304.4" font-size="13" fill="#2B3442">Validate(config); address 0x40 to 0x7F, not 0x70 (LED All Call)</text>
<rect x="338.3" y="219.8" width="27.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="352" y="234.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">no</text>
<text x="792" y="279.6" font-size="15" font-weight="700" fill="#334155">InvalidArgument</text>
<text x="792" y="304.4" font-size="13" fill="#2B3442">nothing sent</text>
<rect x="704.5" y="277.3" width="35" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="291.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">bad</text>
<text x="52" y="394.6" font-size="15" font-weight="700" fill="#1E429F">1  Every output off, from any state</text>
<text x="52" y="419.4" font-size="13" fill="#2B3442">OE high (with GpioSet())</text>
<text x="52" y="438.3" font-size="13" fill="#2B3442">ALL_LED_OFF_H (0xFD) = 0x10: one byte, whatever AI holds</text>
<text x="52" y="457.1" font-size="13" fill="#2B3442">MODE2: OCH = 0, the drive, the inversion, OUTNE = the off level</text>
<text x="52" y="476" font-size="13" fill="#2B3442">ALL_LED_OFF_H = 0x10 again, now applied at the STOP</text>
<text x="792" y="422.6" font-size="15" font-weight="700" fill="#9F1239">Bus or NoDevice</text>
<text x="792" y="447.4" font-size="13" fill="#2B3442">after all four were sent</text>
<rect x="703.3" y="420.3" width="37.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="434.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fails</text>
<text x="52" y="565.5" font-size="15" font-weight="700" fill="#1E429F">2  Sleep and set the frequency</text>
<text x="52" y="590.4" font-size="13" fill="#2B3442">read MODE1; SLEEP and AI; EXTCLK by two writes when asked</text>
<text x="52" y="609.2" font-size="13" fill="#2B3442">PRE_SCALE (it takes a write only asleep); SUBADR1 = the reset sentinel</text>
<text x="792" y="537" font-size="15" font-weight="700" fill="#9F1239">DeviceIdMismatch or ExternalClockLatched or</text>
<text x="792" y="556.5" font-size="15" font-weight="700" fill="#9F1239">Bus</text>
<text x="792" y="581.4" font-size="13" fill="#2B3442">ExternalClockLatched: EXTCLK set, internal clock</text>
<text x="792" y="600.2" font-size="13" fill="#2B3442">asked</text>
<text x="792" y="619.1" font-size="13" fill="#2B3442">DeviceIdMismatch: MODE1 and the next byte cannot be</text>
<text x="792" y="638" font-size="13" fill="#2B3442">a PCA9685</text>
<rect x="703.3" y="572.8" width="37.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="587.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fails</text>
<text x="52" y="699.5" font-size="15" font-weight="700" fill="#1E429F">3  Identity: read everything back</text>
<text x="52" y="724.4" font-size="13" fill="#2B3442">MODE1, MODE2, SUBADR1 and PRE_SCALE as written</text>
<text x="52" y="743.2" font-size="13" fill="#2B3442">all 16 channels full OFF (one 64-byte read)</text>
<text x="792" y="709" font-size="15" font-weight="700" fill="#9F1239">DeviceIdMismatch</text>
<text x="792" y="733.9" font-size="13" fill="#2B3442">another part, or a floating or stuck line</text>
<rect x="696" y="706.8" width="52" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="721.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">differs</text>
<text x="52" y="833.5" font-size="15" font-weight="700" fill="#1E429F">4  Wake and check the wake</text>
<text x="52" y="858.4" font-size="13" fill="#2B3442">MODE1.SLEEP = 0, wait 500 us</text>
<text x="52" y="877.2" font-size="13" fill="#2B3442">read MODE1, MODE2, SUBADR1, PRE_SCALE; OE low</text>
<text x="792" y="843" font-size="15" font-weight="700" fill="#9F1239">DeviceReset or WriteMismatch</text>
<text x="792" y="867.9" font-size="13" fill="#2B3442">the chip reset, or did not wake</text>
<rect x="703.3" y="840.8" width="37.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="722" y="855.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">fails</text>
<text x="52" y="967.5" font-size="15" font-weight="700" fill="#14532D">Started: Ok</text>
<text x="52" y="992.4" font-size="13" fill="#2B3442">every channel off, the chip running the configuration</text>
<rect x="318.6" y="907.8" width="66.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="352" y="922.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">all match</text>
<rect x="32" y="1025.2" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="1036.8" font-size="12.5" fill="#566070">your call</text>
<rect x="131.4" y="1025.2" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="153.4" y="1036.8" font-size="12.5" fill="#566070">driver steps</text>
<rect x="251.7" y="1025.2" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="273.7" y="1036.8" font-size="12.5" fill="#566070">fails, nothing sent</text>
<rect x="408.7" y="1025.2" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="430.7" y="1036.8" font-size="12.5" fill="#566070">fails</text>
<rect x="480.5" y="1025.2" width="14" height="14" rx="4" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<text x="502.5" y="1036.8" font-size="12.5" fill="#566070">Ok</text>
<path d="M543.9 1031.4L573.9 1031.4" fill="none" stroke="#8893A2" stroke-width="1.6" marker-end="url(#fk-arrow-rail)"/>
<text x="587.9" y="1036.8" font-size="12.5" fill="#566070">next step</text>
</svg>
