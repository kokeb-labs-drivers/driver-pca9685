<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="968" viewBox="0 0 1200 968" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the PCA9685 does</title>
<desc id="chip-capabilities-desc">Capability map of the PCA9685: PWM per channel (supported): Sets each output's duty and turn-on delay in 4096 steps, or a servo pulse width in microseconds; Full on and full off (supported): Holds an output fully on or fully off with no PWM; a switch-off is never refused; All channels at once (supported): Switches every output off with one write, or changes a run of channels together in one transfer; PWM frequency and clock (supported): One frequency for all outputs, from the 25 MHz oscillator or an external clock up to 50 MHz; Output drive and inversion (supported): Totem pole or open-drain outputs, optionally inverted, for direct LEDs or external drivers; Output enable pin (supported): Switches every output to its off level at once through the OE pin, with no bus traffic; Sleep and restart (supported): Stops the oscillator to save power, then restarts the PWM where it stopped; Reset detection (supported): Starts from any state with every output off, and finds a power-on or software reset; Group addresses (not covered): LED All Call and three Sub Call addresses; the driver disables them so the chip answers its own only.</desc>
